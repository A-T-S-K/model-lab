name: Model Lab Acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Portable reference conformance
        run: npm run test:reference:portable

      - name: Unit and integration tests
        run: npm test

      - name: Model-only example
        run: npm run example

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: npm run test:browser

      - name: Isolated repository acceptance
        run: npm run test:isolation

      - name: Build standalone container
        run: docker build -t model-lab:acceptance .

      - name: Smoke-test container without WAN
        run: |
          docker run --detach --rm \
            --name model-lab-acceptance \
            -p 127.0.0.1:4188:80 \
            model-lab:acceptance

          trap 'docker stop model-lab-acceptance' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4188/ > /dev/null; then
              break
            fi
            sleep 1
          done

          node --import tsx scripts/smoke-container.ts \
            http://127.0.0.1:4188

      - name: Check whitespace
        run: git diff --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: model-lab-browser-evidence
          path: test-results/
